# Publishes https://litus.tellusai.com/ (the landing page in site/ and the plugin registry) with
# GitHub Pages, from the gh-pages branch: copies site/ there, builds the registry into it, and
# pushes. Published packages stay on gh-pages for good, so every version stays downloadable.
#
# It runs only for main, never for pull requests, and needs no secret: the repository's own
# token pushes gh-pages, which Pages then publishes.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check out the published site
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: pages
      - name: Copy the landing page
        run: cp -a site/. pages/
      - name: Build the registry into the site
        run: python scripts/build.py --site pages
      - name: Publish
        working-directory: pages
        env:
          SHA: ${{ github.sha }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "The published site is already up to date."
            exit 0
          fi
          git config user.name "litus-plugin-registry"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy zfdong/litus-plugin-registry@${SHA:0:7}"
          git push
