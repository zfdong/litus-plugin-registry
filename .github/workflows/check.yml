# Checks registry entries. Pull requests come from anyone, so this workflow has no secrets and
# only reads: it downloads each changed entry's package and checks it, but runs nothing in it.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the scripts
        run: python -m unittest discover -s scripts
      - name: Check the entries this pull request adds or changes
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: python scripts/build.py --check --changed "$BASE"
      - name: Check every entry
        if: github.event_name == 'push'
        run: python scripts/build.py --check
